<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>旅行手册</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1f26;--ink2:#5b6170;--line:#e3e0d8;--accent:#0d6b8f;--warn:#b8321a}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1e2128;--ink:#ecebe6;--ink2:#a0a5b1;--line:#2f333c;--accent:#5cb8dc;--warn:#ff8a70}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding:24px 16px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:var(--ink2);font-size:14px}
input[type=password]{width:100%;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}
input[type=password]:focus{border-color:var(--accent)}
label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin:12px 0 16px}
button{width:100%;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff}
button:disabled{opacity:.6}.err{color:var(--warn);font-size:14px;min-height:20px;margin-top:10px}
</style></head><body>

function norm(s){return s.trim().replace(/[！-～]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-0xFEE0);});}
async function keyFromPw(pw){pw=norm(pw);var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function open(key){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));var html=dec.decode(pt);
 document.open();document.write(html);document.close();}
var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go'),rm=document.getElementById('rm');
f.addEventListener('submit',async function(e){e.preventDefault();err.textContent='';go.disabled=true;go.textContent='解密中…';
 try{var key=await keyFromPw(pw.value);var raw=await crypto.subtle.exportKey('raw',key);
  if(rm.checked){try{localStorage.setItem('tk',b64(raw));}catch(_){}}
  await open(key);}
 catch(_){err.textContent='密码不对，再试一次';go.disabled=false;go.textContent='打开';pw.select();}});
(async function(){try{var t=localStorage.getItem('tk');if(!t)return;
 var key=await crypto.subtle.importKey('raw',b(t),{name:'AES-GCM'},true,['decrypt']);await open(key);}
 catch(_){try{localStorage.removeItem('tk');}catch(__){}}})();
})();
